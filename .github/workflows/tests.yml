name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # core/database.py raises at import time when DATABASE_URL is unset, and
    # core/security.py reads Supabase config at import time. These are throwaway
    # values that let modules import; nothing connects. tests/conftest.py sets
    # the same defaults for local runs.
    env:
      DATABASE_URL: "sqlite://"
      SUPABASE_URL: "http://localhost"
      SUPABASE_JWT_SECRET: "test-secret"
      SUPABASE_KEY: "test-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint for undefined names
        # A router that references a name it never imported still imports
        # cleanly and only fails when the endpoint is called, which no test
        # currently covers. F401 is deliberately not enabled yet: seeds/ relies
        # on side-effect imports to register mappers.
        run: ruff check --select F821 .

      - name: Run tests
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Fails the build if the thresholds in vitest.config.ts aren't met.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
