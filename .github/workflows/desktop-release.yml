name: Desktop Release

# Tauri installers for Windows (MSI), macOS (universal DMG) and Linux
# (AppImage, deb, rpm). Manual runs upload them as workflow artifacts,
# release.yml also attaches them to the draft release
#
# Needs the same three env-var secrets as android-release.yml, since
# tauri.conf.json's beforeBuildCommand runs the identical `next build` and
# NEXT_PUBLIC_* vars are baked in at build time:
#   NEXT_PUBLIC_API_URL
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# No code signing yet: the MSI is unsigned and the DMG is ad-hoc signed

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to attach to, empty for artifacts only
        type: string
        default: ""
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            rust-targets: ""
            args: --bundles msi
            bundle-dir: frontend/src-tauri/target/release/bundle
            files: msi/*.msi
          - platform: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle-dir: frontend/src-tauri/target/universal-apple-darwin/release/bundle
            files: dmg/*.dmg
          # 22.04 so the AppImage runs on distros with an older glibc too
          - platform: linux
            runner: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb,rpm
            bundle-dir: frontend/src-tauri/target/release/bundle
            files: appimage/*.AppImage deb/*.deb rpm/*.rpm

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Collect installers
        working-directory: ${{ matrix.bundle-dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ${{ matrix.files }} "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitnesstracker-${{ matrix.platform }}
          path: dist/*

      - name: Attach to the draft release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" dist/* --clobber
