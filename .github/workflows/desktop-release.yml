name: Desktop Release

# Builds the Windows MSI through Tauri. A manual run just uploads the MSI as
# a workflow artifact; pushing a v* tag also creates a GitHub Release (as a
# draft, so nothing goes live until you publish it) and attaches the MSI
# there
#
# No secrets needed unless you later add code signing or the Tauri updater,
# neither of which tauri.conf.json has configured today

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --bundles msi
          uploadWorkflowArtifacts: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: FitnessTracker ${{ github.ref_name }}
          releaseDraft: true
