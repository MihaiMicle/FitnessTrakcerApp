name: Android Release

# Signed release APK (sideload) and AAB (Play Store)
# Manual runs upload them as workflow artifacts, release.yml also attaches
# them to the draft release
#
# Needs seven repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file, `base64 -w0 your.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# These four are the same values already in your local keystore.properties.
# The other three are whatever's in your local .env.local, needed because
# NEXT_PUBLIC_* vars are baked in at build time and CI has no .env.local:
#   NEXT_PUBLIC_API_URL
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to attach to, empty for artifacts only
        type: string
        default: ""
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the native web export and sync Capacitor
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run sync:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Write the signing config from secrets
        working-directory: frontend/android
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/frontend/android/release.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build release APK and AAB
        working-directory: frontend/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Name the outputs after the version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "dist/FitnessTracker_${VERSION}_android.apk"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab "dist/FitnessTracker_${VERSION}_android.aab"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitnesstracker-android
          path: dist/*

      - name: Attach to the draft release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" dist/* --clobber
